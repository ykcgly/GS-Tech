# ---------- 释梦（下界合金剑 · 右键发射灵魂沙弹）----------
#   分类：构思武器 (gs_weapon)   **第 6 格**
#     获取：**唤梦机**升级（入梦 + **49** 梦境锭，114 秒）
#     ★★★ 第八十七批：梦境锭 **20 → 49**（用户「释梦梦境锭需求改成49个」）；
#       格位由第 5 格挪到**第 6 格**（用户「6释梦」）。
#   附魔：无限（infinity 1）—— 原版是弓的附魔，RSC 用 addUnsafeEnchantment 写值，剑上也能挂
#   ★★ 「无法破坏」怎么做的（RSC 不支持这个字段）：
#     查过源码，items.yml 的 item 段**没有** unbreakable 之类的字段，
#     CommonUtils 里也没有任何 setUnbreakable 调用。所以改用脚本兜住：
#       · 每次右键（onUse）时把手里这把剑设成 unbreakable
#       · gs_listener.js 的常驻任务每 0.5 秒扫一次，发现玩家手上是释梦且还没锁
#         就立刻 setUnbreakable(true)
#     效果：拿到手半秒内就变成"无法破坏"，之后耐久永不再掉。
#   效果（实现见 scripts/gs_release_dream.js）：
#     · 右键朝视线方向打出一道**灵魂沙粒子**（SOUL）弹道：射程 15 格
#     · **碰到实体方块就停下（不穿墙）**；没命中生物 → 什么都不发生
#     · 命中生物 → 从它**正上方 6 格**开始播放下坠动画，
#       粒子**砸到身上那一刻**结算一次 **40 点**伤害（2026-10-06：10 → 25 → 40）；
#       **只有 1 次下坠 = 1 次伤害**（2026-10-06：3 次 → 1 次）
#     · 右键冷却 **0.3 秒**（2026-10-06：1.2 → 0.8 → 0.3）；冷却结束提示「可以重新割开梦境」
#     · 发射音效 = **只有一个**：音符盒放在**羊毛**上、左键调音 **6 次**后的那一声
#       （`block.note_block.guitar`，音高 = note 6 ≈ 0.7071；铁砧/锻造台/心跳声都撤了）
#     · 伤害**不带任何击退**（结算前存 velocity、打完立刻还原 ⇒ 只掉血、不被推开）
#     · **没有内爆/炸开**，也**没有任何会持续残留的粒子云**
#   ★ **附魔（2026-10-06）**：锋利 / 亡灵杀手 / 节肢杀手 / 横扫之刃 / 破甲 /
#     穿刺 / 抢夺 / 忠诚，**全部 9 级**（RSC 走 addUnsafeEnchantment ⇒ 能超原版上限）。
#     （原计划的「突进 lunge」按需求已去掉。）
#   ★★ 脚本里全部用 runLater 链、不用 runRepeating + cancel()：
#     RSC 的 runRepeating 虽然签名返回 BukkitTask，但实现是
#       AtomicReference task; runTaskTimer(... ta -> { r.apply(...); task.set(ta); }); return task.get();
#     同步返回时回调还没跑过 ⇒ **delay > 0 时返回值基本是 null**，cancel() 永远失败
#     → 任务停不下来（之前"粒子一直冒"就是这个原因）。
#   ★ 永不掉耐久（等效 unbreakable）：由 gs_listener.js 的 gsNoDurabilityRegisterSync 拦截耐久损失；
#     不改物品数据，所以仍可正常作为合成材料（RSC 配置层不支持 unbreakable 字段）。
GS_RELEASE_DREAM:
  item_group: gs_weapon
  display_tier: 6            # ★ 第八十七批重排：5 → 6（用户「6释梦」）
  recipe_type: GS_RT_DREAM_SUMMONER
  recipe:
    1: {material_type: slimefun, material: GS_ENTER_DREAM, amount: 1}
    # ★★★ 第八十七批：右槽 **20 → 49**（用户「释梦梦境锭需求改成49个」）
    2: {material_type: slimefun, material: GS_DREAM_INGOT, amount: 49}
  script: gs_release_dream
  item:
    name: "&5释梦"
    material: NETHERITE_SWORD
    enchantments:
      # ★ 2026-10-06 新增 8 条（等级 9，RSC 走 addUnsafeEnchantment ⇒ 可以超过原版上限）
      #   名称用**现代命名空间键名**（`minecraft:<小写>`），和下面那条 infinity 同一套写法
      - "sharpness 9"            # 锋利
      - "smite 9"                # 亡灵杀手
      - "bane_of_arthropods 9"   # 节肢杀手
      - "sweeping_edge 9"        # 横扫之刃
      - "breach 9"               # 破甲（1.21 重锤系）
      - "impaling 9"             # 穿刺
      - "looting 9"              # 抢夺
      - "loyalty 9"              # 忠诚
      - "infinity 1"             # （原有的那条，保留）
    lore:
      # ★★ 2026-10-12 第七十一批：
      #    · 第一句**不变**
      #    · 原来第 3 行「命中生物造成大量伤害」**整行删除**
      #    · 原来最后三句（梦外有光 / 越界则醒 / 魂沙为引）**移到右键前面**并改**紫色 &5**
      #    · 右键改**橙色加粗**，后面「射出灵魂射线」改**白色不加粗**
      #    · 结尾那句「击穿它，或从梦中醒来」用户未提 ⇒ 原样留在最后
