#   ★ 可调参数全在 gs_borrow_life.js 顶部（BL_DMG / BL_HEAL_PER / BL_CD_MS /
#     BL_SIP_TICKS / BL_SIP_PER_TICK / BL_HIT_PLAYERS / BL_CAST_MSG / BL_SOUND…）
