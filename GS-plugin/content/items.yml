# ==========================================
# 构思技艺 (GS) —— 物品定义
# 「万物初生，始于想象」
# 全部使用原版材质
# ==========================================
# ★★ 2026-10-08 大改：基础构思的获取途径整体重做
#   想象力   → GS_RT_HAT（金头盔 · 佩戴「奇思妙想帽」，每秒从头顶掉 1 个）
#   记忆碎片 → 构思机合成（9 个想象力）
#   灵感     → GS_RT_ANTHROPOMORPHIC（拟人思维 · 材料生成器自动产出）
#   臆想     → 构思机合成（槽 2 灵感 + 其余 8 格想象力）
#   念想     → 构思机合成（槽 8 灵感 + 其余 8 格想象力）
#   构想     → 构思机合成（配方不变：四角臆想 / 四边念想 / 中心想象力）
#   奇思妙想帽（新增）→ 构思机合成（槽 5 金头盔 + 槽 1/2/3/4/6 萤石）
#
# ★★ 2026-10-08 第二批（本文件的大改动）：
#   · **新增「入梦」**（铁剑）→ 构思武器第 1 格（释梦的左边）
#   · **新增「梦想套」**（铁头盔/铁胸甲/铁护腿/铁靴子，名字 = 梦境套把「境」改成「想」）
#       → 构思防具第 2~5 格，全部在**构思机**里制作
#       → 在**唤梦机**里升级成「梦境套」（左梦想件 + 右 N 个梦境锭）
#       ⇒ 原「梦境套」顺移到构思防具第 6~9 格
#   · 构思武器顺序（★ 2026-10-09 第十五批重排）：
#       1 入梦 / 2 月镰 / 3 释梦 / 4 蚀月·死神梦镰 / 5 五骊矟 / 6 精神力
#     （月镰插到「入梦」后面、蚀月插到「释梦」后面 ⇒ 原 2/3/4 顺延为 3/5/6）
#   · 梦境 / 本构 / 妄想碎片 → 移到「基础构思」最后三格
#   · 枯骸骑将 / 妄念 → 改到「万象归序·心智构象熔炼炉」合成（原织梦机已删除）
#   · 真实梦境 / 思创本构 / 释梦 / 精神力 → 改到「唤梦机」升级产出
#
# ★★ 2026-10-08 第六批：
#   · 五骊矟材质 → **金剑 GOLDEN_SWORD**（金矛换回来）
#     ★ 2026-10-12 第八十一批：本体仍是金剑，**外观**改用 `minecraft:item_model`
#       渲染成金矛（走 `saveditems/wls.yml`）⇒ 详见下方 GS_WULI_SPEAR 的注释块
#   · **删除「构想维度」分类** ⇒ 真实梦境 / 思创本构 移入「基础构思」（本构之后）
#   · 真实梦境 / 思创本构的**右键效果整段删除**（gs_forge_items.js 已删）⇒ 变纯材料
#   · **基础构思里所有物品取消左右键交互**（唯一例外：滚木保留右键隐身）
#     实现在 scripts/gs_listener.js 的 gsPlainStart()
#
#   ★ 所有「构思机」配方都是**多方块机器**（`mb_machines.yml` 的 GS_RULE_CONCEPTOR），
#     items.yml 里写的 recipe **只是粘液书配方页的展示图**（GS_RT_RULE_CONCEPTOR
#     这个 CustomRecipeType 不绑定任何机器）；真正生效的配方在 mb_machines.yml 里，
#     **两边的格位必须完全一致**（发射器是逐格比对的）。
#
# 3×3 格位编号（从左上到右下）：
#   ┌───┬───┬───┐
#   │ 1 │ 2 │ 3 │
#   ├───┼───┼───┤
#   │ 4 │ 5 │ 6 │
#   ├───┼───┼───┤
#   │ 7 │ 8 │ 9 │
#   └───┴───┴───┘
# ==========================================

# ============ 基础构思 ============

# ---------- 第 1 格：想象力（线，无法放置） ----------
#   获取途径写在「机器位置」的 金头盔 · 佩戴 上（GS_RT_HAT）
#   ★ 2026-10-08：获取方式改成「头上戴「奇思妙想帽」时，每秒从头顶掉落 1 个」。
#     原来「构思」分类里点击获取的那个按钮**已删除**（gs_imagination.js 一并删除）。
#     实现：scripts/gs_listener.js 的 gsTickHeadDrop（每玩家一条自调度链）。
GS_IMAGINATION:
  item_group: gs_basic
  display_tier: 1
  placeable: false
  recipe_type: GS_RT_HAT
  item:
    name: "&b想象力"
    material: STRING
    lore:
      - "&7一切创造最初的空白雏形"

# ---------- 奇思妙想帽（原版金头盔 · 2026-10-08 新增）----------
#   分类：基础构思 (gs_basic)
#   获取：**构思机**合成
#     槽 5 = 原版金头盔 ×1 ｜ 槽 1 / 2 / 3 / 4 / 6 = 萤石 ×5 ｜ 槽 7 / 8 / 9 留空
#     ┌────┬────┬────┐
#     │萤石│萤石│萤石│   槽 1 / 2 / 3
#     ├────┼────┼────┤
#     │萤石│金盔│萤石│   槽 4 / 5 / 6
#     ├────┼────┼────┤
#     │    │    │    │   槽 7 / 8 / 9（必须真的空着）
#     └────┴────┴────┘
#   效果：**戴在头上**时，**每秒从头顶掉落 1 个「想象力」**
#         （实现在 scripts/gs_listener.js 的 gsTickHeadDrop；只算头盔位）
#   ★ **永不掉耐久** —— 已加进 gs_listener.js 的 GS_NODMG_IDS
#     （RSC 的 items.yml 没有 unbreakable 字段，只能用"取消耐久损失事件"实现）
#   ★ placeable: false —— 金头盔本来也不能当方块放，写 false 保险
GS_THINKING_HAT:
  item_group: gs_armor
  display_tier: 1
  placeable: false
  recipe_type: GS_RT_RULE_CONCEPTOR
  recipe:
    1: {material: GLOWSTONE, amount: 1}
    2: {material: GLOWSTONE, amount: 1}
    3: {material: GLOWSTONE, amount: 1}
    4: {material: GLOWSTONE, amount: 1}
    5: {material: GOLDEN_HELMET, amount: 1}
    6: {material: GLOWSTONE, amount: 1}
  item:
    # ★★ 2026-10-12 第七十一批：名字改成**红橙黄绿紫**（逐字一色），lore 全部改成黄色
    name: "&c奇&6思&e妙&a想&d帽"
    material: GOLDEN_HELMET
    lore:
      - "&e想象力从脑子里溢出来"
      - ""
      - "&e戴在头上时"
      - "&e每秒从头顶掉落 1 个想象力"

# ---------- 妄想碎片（唱片碎片 · boss 掉落物 · 基础构思第 19 格） ----------
#   来源：三阶段 boss「妄念」**第三阶段**死掉才掉（**固定 6 个**）
#     ★★★ 第八十五批：原来是「每一阶段死掉都掉 1 / 3 / 8 个（一轮共 12 个）」，
#       用户改成「**妄想碎片也改成第三阶段，固定掉落6个**」
#       ⇒ 现在只有**第三阶段（妄念魔）**掉，且**固定 6 个**（一阶段 / 二阶段不掉）。
#   用途：唤梦机 **60 个妄想碎片 + 1 个残樱 → 1 个余念绝响**
#     ★★★ 第八十五批：原来是「36 个 + 1 个入梦」，用户改成
#       「**余念绝响配方改成60个妄想碎片+残樱**」（入梦早就已经换成残樱了，只动数量）。
#   ★ 材质用原版**唱片碎片**（DISC_FRAGMENT_5）
#   ★ 2026-10-08 第二批：从「构思boss」移回**基础构思**，排在最后 1 格。
#   ★ 2026-10-08 第六批：真实梦境(17) / 思创本构(18) 插到「本构」之后
#     ⇒ 妄想碎片顺移到**第 19 格**。
#   ★★ 2026-10-13 第八十五批：**第 20 格给了新掉落物「暗影宝珠」** ⇒
#     妄想碎片**仍是第 19 格**（不再自称"基础构思最后 1 格"）。
#   ★★★ 2026-10-13 第八十六批：**第 21 格再给新掉落物「血夜粒」**；
#     本件配方类型由 `"NULL"` 改成**仅作显示**的 `GS_RT_WANGNIAN_S3` ——
#     用户「在妄想碎片的**配方界面左边**写上**击败三阶段妄念掉落**」。
#     ★ 机制：`recipe_types.yml` 里定义的 `CustomRecipeType` **不绑定任何机器**，
#       它显示在配方页**左边那一格**（槽 10 = 「机器位置」）；写
#       `recipe_type: <它>` 且**不写 `recipe:`** ⇒ 左边显示提示 +
#       九宫格全空 + 无法合成。（同 GS_RT_HAT / GS_RT_MIND_SMELTING 那套。）
GS_WANGXIANG_FRAGMENT:
  item_group: gs_basic
  display_tier: 19
  placeable: false
  recipe_type: GS_RT_WANGNIAN_S3   # ★ 第八十六批：配方页左边写「击败三阶段妄念掉落」
  item:
    name: "&5妄想碎片"
    material: DISC_FRAGMENT_5
    lore:
      - "&7凝聚起来"
      - ""
      - "&8获取方式：击杀妄念掉落"

# ---------- 暗影宝珠（燧石 · boss 掉落物 · 基础构思最后一格）----------
#   ★★★ 第八十五批新增（用户原话：「新物品，暗影宝珠，材质燧石，
#       放在基础构思最后一格，lore：暗影女王的私藏，上面还刻着些符文呢 附魔无限」）。
#   来源：三阶段 boss「暗影虫卵」**第三阶段（暗影女皇）**死掉才掉
#         —— **固定 6 个**（用户：「暗影虫卵第三阶段掉落物，固定掉落6个」）
#         ★ 实现在 scripts/gs_boss_shadow.js 的 sbPhaseEnd()（stage >= 3 那一支）
#   用途：唤梦机 **60 个暗影宝珠 + 1 个致万千无言者 → 1 个此刻·万籁俱寂**
#         （用户：「此刻万籁俱寂配方改成60个暗影宝珠+致万千无言者」）
#   ★ 材质 **燧石 FLINT**（用户指定）
#   ★ **附魔「无限」**（infinity 1）—— 无限本是弓的附魔，
#     RSC 走 addUnsafeEnchantment ⇒ 燧石上也挂得住（和月镰那把锄头同一个套路）。
#     ★ 它**没有任何实际效果**，纯粹是那层附魔光效（用户要的就是这个观感）。
#   ★ 名字颜色 `&5`（和「暗影虫卵」「妄想碎片」同色，一眼能看出是一个系列的）。
#   ★ **没有配方** —— 只能靠打 boss 掉。
#     ★★★ 第八十六批补：用户「暗影宝珠，血夜粒的配方界面没写谁掉的」
#       ⇒ `recipe_type` 由 `"NULL"` 改成**仅作显示**的 `GS_RT_SHADOW_S3`，
#         配方页左边写「击败三阶段暗影虫卵掉落」，九宫格仍然全空。
GS_SHADOW_ORB:
  item_group: gs_basic
  display_tier: 20
  placeable: false
  recipe_type: GS_RT_SHADOW_S3   # ★ 第八十六批补：配方页左边写「击败三阶段暗影虫卵掉落」
  item:
    name: "&5暗影宝珠"
    material: FLINT
    # ★ 按需求打上「无限」（infinity 1）
    enchantments:
      - "infinity 1"
    # ★★ 两行 lore **全是用户原话，一字未改**（只加了 &7 颜色码）
    lore:
      - "&7暗影女王的私藏"
      - "&7上面还刻着些符文呢"

