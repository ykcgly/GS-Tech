  recipe_type: GS_RT_MIND_SMELTING
  recipe:
    1: {material_type: slimefun, material: GS_THOUGHT_CONSTRUCT, amount: 1}
    2: {material_type: slimefun, material: GS_TRUE_DREAM,        amount: 1}
    5: {material_type: slimefun, material: GS_DREAM_INGOT,       amount: 37}
  item:
    name: "&0滚木"
    material: LIGHT_GRAY_STAINED_GLASS_PANE     # 淡灰色玻璃板
    lore:
      - "&0你居然能看见？"

