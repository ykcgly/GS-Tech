#   材质 **红色混凝土 RED_CONCRETE** ｜ 名字 &c篮球生成器 ｜ **可放置**（placeable: true）
#   全部逻辑在 scripts/gs_listener.js 的 `gsBg*` 模块（和 gsBb* 是两套独立的表）：
#     · **放下后** ⇒ 在这个方块**上方 1.5 格**生成一颗篮球
#       （同一个展示实体渲染、同一套投篮 / 落地弹两下 / 防隧穿逻辑）
#     · ★★ 第三十一批按用户澄清改成：**一台生成器只有一颗球**（GS_BG_MAX = 1）
#       —— **多人抢同一颗**：谁都能捡，捡走后**不会**再长第二颗；球投出落地后
#          别人可以再捡。用户原话："我说的十个人是打一场比赛用一颗球打"
#          （第三十批曾是"最多同时 10 个人各拿一颗"，已作废）
#     · **只有"停着的球"能捡**（生成点上待捡的 / 落地停住的）；
#       已经绑在某人身上的球**捡不走** ⇒ 不存在"从别人身上抢球"
#     · **离方块超过 32 格** ⇒ 自动送回生成器上方（GS_BG_RANGE）
#     · 捡起后跟着玩家运球，右键投出；落地后别人可以再捡
#     · **方块被破坏** ⇒ 它名下的球全部消失（实体也一起删掉，不留幽灵）
