#     └────┴────┴────┘
#     即：**槽 1/3/4/6/7/9 = 纸 ×6**、**槽 2 = 骷髅头颅 ×1**、
#         **槽 5 = 木棍 ×1**、**槽 8 = 绿宝石 ×1**
