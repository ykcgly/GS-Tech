# 致万千无言者（GS_VOICELESS · 构思武器第 2 格 · 2026-10-10 第三十七批新增）
#   材质 **石镐 STONE_PICKAXE**（外观是"最普通的工具"，扣 lore 里"无人替他们呐喊"）
