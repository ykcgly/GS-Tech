# ---------- 第 6 格：构想（向日葵，无法放置，无法栽入花盆） ----------
# 唯一真配方：魔法工作台 3×3
#   四角 = 臆想 ×4    四边 = 念想 ×4    中心 = 想象力 ×1
#   ┌─────┬─────┬─────┐
#   │ 臆想 │ 念想 │ 臆想 │   1 / 2 / 3
#   ├─────┼─────┼─────┤
#   │ 念想 │想象力│ 念想 │   4 / 5 / 6
#   ├─────┼─────┼─────┤
#   │ 臆想 │ 念想 │ 臆想 │   7 / 8 / 9
#   └─────┴─────┴─────┘
# ==========================================================================
# 规则系列（全部在「构思机」多方块机器里合成）
# --------------------------------------------------------------------------
# ★ 2026-10-08：格位布局全部按需求重排
