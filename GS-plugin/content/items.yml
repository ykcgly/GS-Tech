# ---------- Bad Apple（兔子皮 RABBIT_HIDE + item_model 渲染成附魔金苹果 · 构思玩具第 10 格）----------
#   分类：构思玩具 (gs_toy) —— 第 10 格（**紧接「借寿」第 9 格之后**）
#     ★ 别被 items.yml 里的「1~7 + 9」骗了：**第 8 格不是空的** ——
#       那是「**海水过滤器**」，它是**机器**，
#       写在 `recipe_machines.yml` 里（`item_group: gs_toy` / `display_tier: 8`），
#       所以 items.yml 这边看着像缺了一格。
#     ★★★ 第八十八批：用户「删除构念，构思玩具全部往前移一格」
#       ⇒ 构念（原第 1 格）整件删除、玩具整体前移 ⇒ Bad Apple **11 → 10**。
#   获取：**魔法工作台（MAGIC_WORKBENCH）**九宫格 ——
#     ★ 用户原话：「配方魔法工作台九宫格5原版苹果」
#     ┌──────┬──────┬──────┐
#     │  1   │  2   │  3   │
#     ├──────┼──────┼──────┤
#     │  4   │5 苹果│  6   │   ← **只有正中间第 5 格**：APPLE ×1
#     ├──────┼──────┼──────┤
#     │  7   │  8   │  9   │
#     └──────┴──────┴──────┘
#   材质：`material_type: saveditem` → `saveditems/ba.yml`
#     ★ 存档物品本体是**兔子皮**（`minecraft:rabbit_hide`），
#       靠 `minecraft:item_model: "minecraft:enchanted_golden_apple"`
#       **在客户端渲染成附魔金苹果**。
#       ⇒ 和「五骊矟」（金剑 + item_model 渲染成金矛）是**同一种做法**：
#          `id` 决定**行为**，`item_model` 只决定**客户端长什么样**。
#     ⚠ `saveditems/ba.yml` 是这件物品的一部分 —— 重装附属时不能只放
#        yml + scripts，必须连 `saveditems/` 一起放（否则物品会变成空气 / 石头）。
#   效果（见 scripts/gs_bad_apple.js）：
#     · 右键：为**按的那个人自己**播放整首《Bad Apple!!!》
#       （红石音乐，**36462 个音符 / 183.5 秒**）
#       ★ 曲谱来自 `server\plugins\Bad Apple!!!.nbs`，
#         已**离线转成脚本里的 SG_TL 表**并写死 ⇒ **运行时不用读 .nbs、无额外依赖**
#         （转换工具：`_check/nbs_to_js.py`，配置 `_check/bad_apple_cfg.json`）
#       ★ 音符盒只有 **0~24 共 25 档（2 个八度）**，本曲跨度 **71 个半音** ⇒
#         取**全局平移 +7**（落进范围的音最多 = 87.9%），超出的音按八度折回。
#         25 档是硬上限，换任何写法都躲不掉；折回会让那 12.1% 的音程有偏差。
#     · **不消耗**物品（可以反复按）
#     · ★★ **冷却 = 整首歌的时长**（用户：「冷却就是整首歌」）
#       ⇒ 脚本里写的是 `SG_CD_MS = SG_LEN_MS` = **183536 毫秒 = 183.5 秒**，
#         曲子放完的那一刻冷却正好走完（理论上可以无缝连播）
#     · 冷却中**静默忽略**（不提示、不出声、不消耗）
#     · **无法与任何方块交互**：手持本物品右键方块时，方块功能一律不触发
#       （不开箱子 / 不耕田 / 不放方块 / 不点按钮…），只走本脚本的音效
#     · 默认只有**按的人自己**听得到（`SG_OWNER_ONLY = true`）
#     ★ 与「咒术回战」是**同一套播放引擎**（都由 `_check/nbs_to_js.py` 生成），
#       区别只有两点：
#         ① 本曲**不召唤任何生物**（咒术回战会召唤「宿瘫」+「五条舞」）；
#         ② 本曲长得多（**183.5 秒** vs 43.5 秒）。
# ==========================================================================
GS_BAD_APPLE:
