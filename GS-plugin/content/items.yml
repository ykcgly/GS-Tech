#     · **lore 整段删除**（需求："删除篮球生成器的lore"）⇒ 物品只剩名字与材质
#     · ★★ 同批把**「你等着收我的律师函吧」（GS_LAWYER_LETTER）整段从这里删掉了**
#       —— 它那套"穿胸甲自动出球"的脚本逻辑（gsBb*）**保留没删**，
