#     「暗影虫卵二阶段固定掉落一把致万千无言者，删除配方，改成击败二阶段暗影掉落」
#     ⇒ 构思机那条配方已从 `mb_machines.yml` **删除**，本件改成**纯掉落物**：
#       由两阶段 boss「守夜人的提灯」**不是**、而是**暗影虫卵（GS_SHADOW_EGG）
#       第二阶段（暗影猎手）**死掉固定掉 **1 把**
