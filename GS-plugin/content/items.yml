# ---------- 五骊矟（金剑 GOLDEN_SWORD · 五骊鞚骑阵 · 构思武器第 3 格）----------
#   材质沿革：金剑 → 烈焰棒(BLAZE_ROD + item_model 渲染成金矛外观)
#             → 原版金矛(GOLDEN_SPEAR) → 2026-10-08 第六批金剑 GOLDEN_SWORD
#             → ★★ 2026-10-12 第八十一批**定稿：金剑 + `minecraft:item_model` 渲染成金矛外观**
#   ==========================================================================
#   ★★★ 2026-10-12 第八十一批：外观改成「金矛」，但**本体仍是金剑**。
#   --------------------------------------------------------------------------
#   用户原话：「五骊矟的材质改成 <saveditems/wls.yml>，
#              这是一个材质为金矛的金剑，而不是让五骊矟变成长矛」
#
#   ★★ 这两件事**必须分清楚**（用户特意强调了）：
#     · **本体（id）= 金剑 `minecraft:golden_sword`** —— 决定**行为**：
#         耐久 32、左键挥砍、右键举剑、F 换副手，以及 Slimefun 侧的物品类型。
#         监听器 / 耐久保护 / 左键剑气 / 右键冲锋**全都按这个走，一个字没动**。
#     · **外观（`minecraft:item_model`）= 金矛 `minecraft:golden_spear`** ——
#         只决定**客户端怎么画**（1.21.4+ 的物品模型组件），**不改变任何行为**。
#     ⇒ 所以**不是**「把五骊矟变成长矛」：它长得像矛，但挥起来还是剑。
#       ★ 反面教训：2026-10-07 那次直接把 `material` 改成 `GOLDEN_SPEAR`，
#         那是**换本体**（换成了真长矛）⇒ 1.21.11 的长矛有自己的一套
#         左键/右键动作，和本附属的同步监听器打架。**这次不碰本体。**
#
#   ★★ 为什么必须走 saveditem：RSC 的 items.yml **写不出任意数据组件**。
#      （详见第八十批留档：`item:` 段真正只读 9 个键 ——
#        material_type / material / name / lore / glow / enchantments /
#        modelId / amount / color，**没有** components / nbt / item_model 之类。）
#      ⚠ 注意别和 `modelId` 搞混：那个写的是**自定义模型数据 CustomModelData**，
#        不是 1.21.4+ 的 `minecraft:item_model` 组件，两者不是一回事。
#      ⇒ 和紫水晶纹饰 / 滚木（第八十批，已撤销）一样，走**存档物品**。
#
#   ★ `saveditems/wls.yml`（逐字节从服务器 addons/GS/saveditems/ 复制过来）：
#       item:
#         ==: org.bukkit.inventory.ItemStack
#         DataVersion: 4671
#         id: minecraft:golden_sword
#         count: 1
#         components:
#           minecraft:item_model: '"minecraft:golden_spear"'
#         schema_version: 1
#     ★★ 值 `'"minecraft:golden_spear"'` 里的**内层双引号是必须的** ——
#        `minecraft:item_model` 的 codec 是 `ResourceLocation.CODEC`
#        （= `Codec.STRING`）⇒ Paper 用 NbtOps 序列化时得到的是
#        **一个 StringTag**，`StringTag.toString()` 会**带引号**。
#        这正是 Paper 自己 `/rsc saveitem` 存出来的原样，别手贱把引号删了。
#     ★ 外层单引号是 YAML 的字面量引号 ⇒ 整个值被当成一段普通字符串，
#       RSC 再交给 `SNBT_REGISTRY_UNAWARE_PARSER.parseFully(...)` 解析。
#
#   ★ 名字 / 9 行 lore / 分类 / tier / placeable / recipe_type / **技能与特效**
#     **一个字没动**（监听器按 Slimefun ID `GS_WULI_SPEAR` 判定，与材质无关）。
#   ★ 金剑只有 **32 点耐久**，`GS_NODMG_IDS` 的耐久保护照常生效，永不掉耐久。
#   ⚠ **`saveditems/wls.yml` 是这件物品的一部分** —— 重装附属时必须一起放
#     （已打进 GS.zip，包内路径 `GS/saveditems/wls.yml`）。
#   ⚠ 换外观**不会同步到世界里已有的旧五骊矟** ⇒ 想看效果要重新
#     `/sf give GS_WULI_SPEAR`（枯骸骑将掉落的也是新件）。
