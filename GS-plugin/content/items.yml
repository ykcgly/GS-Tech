#     配方页左边改用 `GS_RT_SHADOW_S2` 显示「击败二阶段暗影虫卵掉落」。
#   ★ 手持时**挖不动方块**（LEFT_CLICK_BLOCK / BlockBreakEvent / BlockDamageEvent 全取消），
#     右键也不与任何方块交互（石镐不许挖矿 / 不许开箱子）
