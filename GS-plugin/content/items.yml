#   ★ **阵营**：枯骸将军 / 璇骊 / 伺骨 / 残驹 = 自己人，斩击、冲刺、凋零之首**都不会误伤**，
#     伺骨也不会回头打 boss（`BR_ALLY = false` 可关）
#   ★ **出场 BGM**：boss 周围 64 格内循环播放唱片 **Lena Raine - Pigstep**（猪灵堡垒遗迹那张，2:28）
#     （`BR_MUSIC` / `BR_MUSIC_RANGE` / `BR_MUSIC_SOUND` 可调；万一没有 pigstep 自动退到 ward）
#   技能 = **五骊矟的削弱版**，**全程没有任何提示词**
#     · **斩击**：**7 点**伤害 / 冷却 **3.5 秒** / 射程 10 格（一点击退 + 横扫粒子）
#       ★ **由 boss 射出、一路飞过去**（不是瞬间糊脸）：先举剑 0.3 秒，
#         再以 0.35 格/刻推进 ⇒ 飞完 10 格约 1.45 秒，玩家看得见、躲得开
#     · **冲刺**：**8 点**伤害 / 冷却 **30 秒** / 冲 **7 格**（1 秒动画，不是瞬移）/ **不无敌**
#       ★ **无视防具`（BR_DASH_PIERCE = true`）**：盔甲 / 保护附魔 / 抗性**一律不减伤**
#   ★ **原版掉落物全部删除**：骷髅的骨头 / 箭、骷髅马的骨头一律不掉
#     （空战利品表 + 死亡事件里 getDrops().clear() 双保险），经验也不掉
#   ★ **boss 死亡必掉「五骊矟」**（GS_WULI_SPEAR，掉在它倒下的地方）
#   ★ **boss 死了 → 战马跟着一起死**；**战马先死 → 惹怒 boss**，解锁新能力：
#     朝最近的玩家发射**凋零之首**（黑色未蓄力，**不会炸坏地形**），
