#       ★ 同时**不造成击退**（先存速度、打完还原）
#     · **命中 n 只 ⇒ 自己回 1×n 点血**（上限受 Attribute.MAX_HEALTH 约束）
#     · **吸血粒子**：被命中的生物在 **0.5 秒**内从**自己身上**冒出**红色粒子飞向玩家**
