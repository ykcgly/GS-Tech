# ---------- 滚木（淡灰色玻璃板 · 名字与 lore 都是黑色）----------
#   ★ 2026-10-08 第二批换新配方：
#     1 思创本构 + 1 真实梦境 + 37 梦境锭 → 1 个滚木，8 粘液刻
#   放在「基础构思」(gs_basic) 分类
#   玻璃板 → placeable: false 禁止放置方块（不影响塞进机器），右键触发脚本
#
#   ==========================================================================
#   ★★★ 2026-10-12 第八十批：**试过「隐藏提示框」，又撤掉了** + 滚木 lore 只留一行。
#   --------------------------------------------------------------------------
#   用户原话（第一次）：「可不可以给滚木打上 minecraft:hide_tooltip={} 的标签」
#   用户原话（撤销）  ：「取消这个标签，这会导致某些配方玩家看不见提示误以为配方
#                        出错无法制作，滚木的 lore 只保留一行你居然看得见其他删除，
#                        效果不删除」
#
#   ★★ 结论：**标签撤了，滚木的材质回到最普通的淡灰色玻璃板。**
#      撤销理由（用户给的）：藏掉提示框之后，玩家在配方界面里**看不见这个材料**
#      ⇒ 会误以为配方坏了、做不出来。**这是对的** —— 存档物品的 tooltip_display
#      是「所有显示这个 ItemStack 的地方都不弹提示框」，
#      包括粘液科技书 / 构思机配方页 / 物品栏悬停，覆盖面比想象中大。
#
#   ★ 本批**最终**留下的唯一改动：**lore 从 6 行砍到 1 行**。
#       保留：&0你居然能看见？
#       删除：空行 / 右键说明 / 隐身说明 / 空行 / 冷却说明（共 5 行）
#     ⚠ **右键隐身的脚本效果一点没动**（用户：「效果不删除」）——
#       冷却 9 秒 / 宽3 × 长5 / 隐身 10 秒 / 物品不消耗，全都照旧，
#       只是不再写进 lore 里给玩家看。
#
#   --------------------------------------------------------------------------
#   ★ 下面是这一批**试错过程**的记录（结论已作废，留档备查）：
#
#   ★★ 版本坑：`minecraft:hide_tooltip` 这个组件在 **1.21.11 里已经没有了**。
#      它是 **1.20.5（24w12a）**加进来的**无值组件**，
#      **1.21.5 起被并入 `minecraft:tooltip_display`**（一个复合组件）。
#      证据（都在本机 paper-1.21.11.jar 里核过）：
#        · `net.minecraft.core.component.DataComponents` 里**只有**
#          `TOOLTIP_DISPLAY` / `TOOLTIP_STYLE`，**没有** `HIDE_TOOLTIP`；
#        · `net.minecraft.util.datafix.fixes.TooltipDisplayComponentFix`
#          干的就是把 `minecraft:hide_tooltip` 迁移成 `minecraft:tooltip_display`
#          （在 DataFixers 里挂在 schema **4307 → 4309**，正是 1.21.5 的开发期）；
#        · `TooltipDisplay` 的 CODEC 字段名是 `hide_tooltip` 和 `hidden_components`，
#          两个都是 `optionalFieldOf`（缺省 false / 空集）。
#      ⇒ 等价写法是 `{hide_tooltip:true}`（`true` 和 `1b` 都能解析）。
#
#   ★★ 为什么当时必须走 saveditem：RSC 的 items.yml 写不出**任意数据组件**。
#      把 RSC Build 63 的 `CommonUtils` 字节码翻了一遍（并对着源码复核过），
#      `item:` 段**真正读的键**只有 9 个：
#        material_type / material / name / lore / glow / enchantments / modelId /
#        amount / color
#      其中 `material_type` 的**取值**有：
#        mc（默认）/ minecraft / vanilla / slimefun / sf / saveditem /
#        skull / skull_hash / skull_base64 / skull_url / uniitem / built_in / none
#      （`noConsume` / `slot` 是**配方输入**那边的键，不是 item: 段的。）
#      **没有** components / nbt / item_flags / hide_tooltip / unbreakable 之类
#      —— 从 Build 63 一直到最新 HEAD 都是这样（已核对上游 diff：
#         9bfb437→HEAD 只动了 gradle/libs.versions.toml，**零 Java 改动**）。
#      ⇒ 当时和第五十五批的「紫水晶 flow 纹饰」一样，改用了**存档物品**
#        `saveditems/gm.yml`（底材仍是淡灰色玻璃板 + 一条 tooltip_display）。
#      ⚠ **那个文件已经删掉了** —— 撤销之后滚木不再依赖任何存档物品。
#
#   ★ 留档：那个组件的效果是「**整个提示框都不显示**」——
#     连名字「滚木」和 lore 一起隐藏，鼠标移上去什么都不弹。
#     如果**以后**还想藏（只藏 lore、保留名字），写法是：
#         minecraft:tooltip_display: '{hidden_components:["minecraft:lore"]}'
#     ★★ 但先想清楚用户这次的教训：**配方界面里看不见材料 = 玩家以为配方坏了**。
#   ==========================================================================
GS_ROLLING_LOG_INGOT:
  item_group: gs_basic
  display_tier: 14
  placeable: false                   # 禁止放置方块（玻璃板也不给放）
