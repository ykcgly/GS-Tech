#     （工具材质右键会被原版抢走 useItemInHand ⇒ onUse 不稳定，
#       而且带 script 时 RSC 会紧跟 e.cancel() 干扰右键，所以统一走同步监听器）
#     · **被动 · 连击**：连击数用一条**灰色倒计时血条**计时，标题 `言 N/7`（整条灰色）；
#       血条长度 = 剩余时间；**3 秒内攻击命中 ⇒ 连击 +1**（并重新计时），
#       **3 秒未命中 ⇒ 连击 -1**（窗口重置，再等 3 秒才继续掉）⇒ 逐层衰减、不是一次清零
#       ★★ 第四十批：**只有命中"活物"才算**（掉落物 / 经验球 / 展示实体 / 盔甲架
#          一律不算）—— 否则对着地上一堆掉落物挥几下就能把连击无痛叠满。
#          左键挥砍与右键「逝言」**两条路径都过这一关**（见 gsIsCombatTarget）。
#     · **伤害随连击提高**：1 连击 = **7 点**，每多一层 **+1** ⇒ 满 7 连击 = **13 点**
#       （`GS_VO_DMG_BASE` / `GS_VO_DMG_PER`，想改成长曲线只动这两个常量）
#     · **左键**：挥砍（灰色弧光粒子），命中范围内生物按**当前连击**结算伤害；
#       命中 ≥ 1 个生物 ⇒ 连击 +1。★ 手持时**原版近战那一下被取消**
#       （怪不再被击退、不再吃 10 刻无敌帧，否则怪会被推出范围 ⇒ 连击断掉）
#     · **右键「逝言」**：**蓄力 0.6 秒**（身上浮现附魔台漂浮文字粒子）后，
#       朝**准星方向**挥出一道**灰色弧形斩击** ——
#       最远 **7 格**、宽度 **3 格**、最多**穿透 4 个生物**、每个 **11 点**伤害；
#       弹道划过的位置会**短暂残留附魔台文字粒子**
#   ★ **获取**：**构思机**（多方块机器）里合成 —— 就是下面这段 `recipe:` 的九宫格。
#     真正生效的那条在 `mb_machines.yml` 的 `GS_RULE_CONCEPTOR.recipes.voiceless`，
#     **两份的格位必须完全一致**（发射器是逐格比对的）。
