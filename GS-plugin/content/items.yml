#   【被动 · 连击「寂」】最高 **99** 连击；一条**红色** BossBar 计时：
#     标题 `§c寂 §4N` —— **「寂」亮红（§c）+ 数字暗红（§4）**，
#     ★ **不再用 `N/99` 表示上限**，直接就是那个数字（上限只在脚本里卡）；
#     血条长度 = **剩余时间 / 7 秒**。
#     **7 秒内命中 ⇒ 连击 +1**（并重新计时）；**7 秒未命中 ⇒ 直接清 0**
#     （★ 与「致万千无言者」的逐层衰减不同：这一把是**一次清零**）。
#     ★★ 第四十批：**只有命中"活物"才算**（掉落物 / 经验球 / 展示实体 / 盔甲架
#       一律不算）—— 否则对着地上一堆掉落物挥几下就能把连击无痛叠满。
#   【伤害随连击提高】**初始 17 点**，**每层 +2** ⇒ 满 99 连击 = 17 + 2×98 = **213 点**
#     （`GS_SI_DMG_BASE` / `GS_SI_DMG_PER`，想改曲线只动这两个常量）
#
#   【左键 · 斩击】对**前方 宽 3 × 长 5 × 高 2** 的范围内所有生物造成伤害
#     （★ 判定是整个长方体，不是一条线）；命中 ≥ 1 个生物 ⇒ 连击 +1。
#     特效 = **附魔台文字**，走一道**斜劈弧线**，两刀一左一右交替：
#       · 第 1 刀：从（长1 左1 高1）划到（长5 左3 高2）
#       · 第 2 刀：从（长1 左3 高1）划到（长5 左1 高2）
