# ==========================================================================
# 梦境套（下界合金四件 · 构思防具第 6~9 格）—— 由**唤梦机**升级梦想套而来
# --------------------------------------------------------------------------
# ★ 2026-10-11 第五十五批（第四轮追加）：**四件的材质全部换成「存档物品」**。
#   用户原话：「梦境套的其他属性不变，只改变这些材质」，给了 4 个存档物品：
#       saveditems/t.yml  → 下界合金头盔   → GS_DREAM_HELMET
#       saveditems/j.yml  → 下界合金胸甲   → GS_DREAM_ARMOR
#       saveditems/h.yml  → 下界合金护腿   → GS_DREAM_LEGGINGS
#       saveditems/x.yml  → 下界合金靴     → GS_DREAM_BOOTS
#   四个文件的底材和原来一模一样，**唯一多的是一条盔甲纹饰**：
#       minecraft:trim = { material: "minecraft:amethyst", pattern: "minecraft:flow" }
#   ⇒ 也就是「紫水晶 + flow（涡流）纹饰」的下界合金套。
#   ★ 名字 / 附魔 / lore / 配方 / 分类 / tier / 全部脚本效果**一个字没动**。
#   ★ 为什么要走 saveditem：RSC 的 items.yml 里写不出 `minecraft:trim` 这个组件
#     （`material: NETHERITE_CHESTPLATE` 只能得到一件**没有纹饰**的素甲），
#     所以和「妄念」「幻翼boss」一样改用存档物品 —— **文件名即引用名**。
#   ★ 工作原理（已核对 RSC Build 61 字节码）：
#       material_type: saveditem → CommonUtils.getBaseItemStack() 读
#       addons/GS/saveditems/<material>.yml 的 `item:` 段（Bukkit 的 ItemStack
#       YAML 序列化）⇒ 纹饰作为组件原样带过来；
#       之后 readItem() 再往上盖 name → lore → enchantments（顺序已核对）。
#   ★ Slimefun 的物品 ID 是 RSC 自己用**配置里的键名**写进去的
#     （`new SlimefunItemStack(<GS_XXX>, stack)`）⇒ 存档文件里**不需要**带
#     `slimefun:slimefun_item`，四个新文件本来也没有。
#   ⚠ **saveditems/ 是这四件物品的一部分** —— 重装附属时必须一起放
#     （h/j/t/x.yml 已打进 GS.zip，包内路径 `GS/saveditems/*.yml`）。
# ==========================================================================
