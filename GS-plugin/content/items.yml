#         朝向 = **冲刺方向**（水平，不吃俯仰），在第 0 / 6 / 12 / 18 刻各斩一道，
#         每道飞 20 刻 ⇒ **4 道全部在冲刺动画内斩完**（`WL_DASH_QI_ON` / `WL_DASH_QI_AT`）
#         ★ 自动斩击**完全没有击退**（`WL_DASH_QI_KB_MUL = 0`；手动左键那道保留击退）
#       ★ 蓄力无敌在「冲刺开始 / 冲刺结束 / 收阵 / 下线 / 死亡」时都会无条件解除，
#         绝不会带出这段动作（invulnerable 不会自己过期，漏关 = 永久免伤）
#         · 使用时提示「&6冲锋！」
#         · 冷却中提示「&7奔袭调息，静待时机。」
#     · 全程 5 匹马都**无敌**（穿梦境护腿的杀戮光环会跳过它们，不伤不弹）
#   配方材料以外的说明：
#     · 物品**不是消耗品**，可以反复上马
#     · ★ **永不掉耐久**（2026-10-05）：已加进 GS_NODMG_IDS 清单 —— 取消
#       PlayerItemDamageEvent + 每 10 刻把主/副手 damage 兜底补满。
#       金剑原版只有 32 点耐久，不保护砍几十下就断了。做法和释梦/梦境套一致，
#       **不改物品数据**（不 setUnbreakable）⇒ 照样能当材料、能进背包堆叠。
#       （2026-10-07 曾改烈焰棒 ⇒ 本身无耐久；2026-10-08 第六批材质定稿
#         **金剑 GOLDEN_SWORD**，金剑只有 32 点耐久 → 这套保护**确实在用**）
#     · ★ 副手「五骊鞚」**无法交互**（2026-10-05）：右击生物一律取消（含盔甲架），
#       拴绳系栅栏的 PlayerLeashEntityEvent 也单独拦了 —— **栓不了任何动物**；
#       判定是"主手或副手拿着它"就取消，丢弃 / 拖拽 / 点击背包 依旧全拦。
#     · ★ 物品**故意不写 `script:` 字段** —— 左键 / F 键都不是"物品右键"，
#       Slimefun 的 onUse 收不到；而且带 script 时 RSC 会紧跟 e.cancel() 干扰右键。
#       逻辑统一放在 scriptListener（gs_listener.js）自己注册的**同步监听器**里。
