#            长 5 沿 **准星方向 f**（含俯仰）｜ 宽 5 沿 **水平右向 r** ｜
#            高 2 沿 **u = r × f**（垂直于 f/r 的"上"）
#          ⇒ 抬头往天上打、低头往脚下打都能打到；平视时与旧版**完全等价**。
#     · 盒内**所有生物**各吃 **1 点**伤害
