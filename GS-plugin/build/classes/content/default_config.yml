# ==========================================
# 构思技艺 (GS) —— 默认配置文件
# 「万物初生，始于想象」
# ==========================================
# RSC 会把本文件复制到:
#   RykenSlimeCustomizer/addon_configs/gs/config.yml
# 服主请修改复制出来的那一份，不要直接改这里的模板。
# ==========================================

# ---------- 想象力（★ 2026-10-08 已废弃） ----------
# 「构思」分类里的「想象力」点击按钮**已删除**，想象力改成
#   **佩戴「奇思妙想帽」时每秒从头顶掉落 1 个**（配置见下面的 thinking-hat）。
# 这一段保留只为兼容老配置，**改它不会有任何效果**。
imagination:
  # 【已废弃】每次点击获得的数量
  amount: 1
  # 【已废弃】两次捕捉之间的冷却（毫秒）
  cooldown-millis: 500

# ---------- 作者想说的一些话（「构思」界面 · 第 1 格按钮） ----------
# 和「想象力」同款：点击直接把成书放进背包（内容靠右键时写进书里）
author-note:
  # 每次点击获得的数量
  amount: 1
  # 两次获取之间的冷却（毫秒）；500 = 0.5 秒，0 = 不启用冷却
  cooldown-millis: 500

# ---------- 记忆碎片（★ 2026-10-08 已废弃） ----------
# 记忆碎片的获取方式改成「**构思机里用 9 个想象力合成**」，
# 原来的「携带想象力死亡掉落」**代码已从 gs_listener.js 里整段删除**
# （所以这里就算写 enabled: true 也不会有任何效果 —— 改模板也不会影响
#   已经复制出来的 addon_configs/gs/config.yml，删代码才是彻底的）。
memory-fragment:
  # 【已废弃】是否启用死亡掉落
  enabled: false
  # 【已废弃】每次死亡最多消耗的想象力数量
  consume: 1

# ---------- 滚木锭（右键隐身） ----------
# 效果：右键后，自己前方 宽 × 长 的区域里所有生物（含自己）隐身
# 改完需要重新加载附属（/rsc reload 或重启服务器）
rolling-log-ingot:
  width: 3             # 前方区域：宽（格，会向上取奇数，保证左右平分）
  length: 5            # 前方区域：长（格，从自己面前第 1 格开始算）
  invis-seconds: 10    # 隐身持续时间（秒）
  cooldown-seconds: 9  # 冷却（秒），0 = 无冷却

# ---------- 真实梦境 / 思创本构 ----------
# 【已废弃 2026-10-08 第六批】右键效果（药效 + 定时刷物品）已整段删除，
#   scripts/gs_forge_items.js 文件也已删除 ⇒ 这两件现在是**纯材料**。
#   原来的 forge-items 配置段一并删除（留着也不会有任何效果）。

# ---------- 梦境套「套装效果」（★ 2026-10-09 第十二批重做） ----------
# ★★ 四件装备**各自的技能已全部删除** —— 单独穿任意一件**没有任何效果**。
#    只有「梦境头盔 + 梦境盔甲 + 梦境护腿 + 梦境战靴」**四件齐全**时，才触发：
#      · 入梦   —— 允许飞行（★ 已删除「入梦」这句提示词）
#      · 免死   —— 致命伤害被吃掉一次（配置见下），提示「这是我的梦！」、冷却 45 秒
#      · 药效   —— 生命恢复 II / 夜视 / 迅捷 II / 饱和 III / 抗性提升 IV / 急迫 III
#                  （一次给 30 秒、剩余低于 27 秒自动续期；摘套立刻收走）
#      · 防辐射 —— 携带粘液科技辐射物品也不会累积辐射（不中任何辐射 debuff）
#                  ★ 实现 = 持续刷新 RadiationTask 的辐射宽限期（主线程，每 0.5 秒一次，
#                    窗口 15 秒 = 本服 options.radiation-grace-period）。见 gsRadShield()。
#      · 粒子   —— 下面 aura 那一圈（原「梦境盔甲」的粒子圈，现在只在四件齐全时出现）
#    摘下任意一件 → 上面全部**立刻收走**。
#
# ---- 免死（判定与原来的「梦境盔甲」完全一样，只是换成套装效果、冷却 45 秒）----
# 受到致命伤害（当前血量 - 本次最终伤害 ≤ 0）时会：
#   · 拦截这次伤害（人不会死，血也不掉）
#   · 播放不死图腾音效 + 图腾粒子
#   · **不消耗耐久**（释梦 / 梦境套整体已设为永不掉耐久）
# ★ 段名沿用 dream-armor 的历史值已改名为 dream-set（旧段留着不会被读取）
dream-set:
  enabled: true
  # 免死冷却（毫秒）：45000 = 45 秒；0 = 无冷却
  #   ★ 第十二批：17000（17 秒）→ 45000（45 秒）
  #   冷却期内再次受到致命伤害不会被拦（会正常死亡）
  cooldown-millis: 45000
  # 免死触发后把血量补到「至少」这么多：12 = 6 颗心；0 = 不补血
  #   只有当前血量低于这个值时才抬上去，比它高就不动（不会扣血）
  #   作用是免死之后不会残血跑不掉
  heal: 12
  # 【已废弃】早期是"每次触发扣胸甲耐久"，现在耐久不再掉落，此项不再生效
  durability-percent: 9
  # 这些伤害原因**不拦截**（写 DamageCause 的枚举名，可自行增删）
  #   VOID    = 虚空
  #   KILL    = /kill 之类的指令伤害
  #   SUICIDE = 自杀类指令伤害
  ignored-causes:
  - VOID
  - KILL
  - SUICIDE
  # 触发音效（留空 "" 则静音）
  sound: item.totem.use
  # 是否播放图腾粒子
  particle: true
  # 触发提示（留空 "" 则不提示）
  message: '&5这是我的梦！'
  # 耐久耗尽、胸甲碎裂时的提示（留空 "" 则不提示）
  break-message: '&c梦境：该醒醒了'
  # ---- 套装粒子（★ 四件齐全才有；穿上单件不刷）----
  # 一种粒子在身周**固定位置**排列，each-count 个（默认 6 个）：
  #   · 位置固定不动（跟着人走，但不环绕、不聚拢、不旋转）
  #   · 一圈均分 6 个点
  #   · 都在**脚部平行**高度（不抬升）→ 一圈贴地环绕的"浮标"
  aura:
    enabled: true
    # 刷新间隔（游戏刻）：3 刻 = 0.15 秒；改这个需要重载附属
    interval-ticks: 3
    # 一圈几个点（默认 6 个）
    each-count: 6
    # 环绕半径（固定不动，格）
    radius: 0.8
    # 粒子高度（相对脚底）：贴脚部水平
    height-high: 0.1
    height-low: 0.1
    # 粒子种类：最多 3 个（多写的会被忽略），名字里带 HEART 的会被强制跳过
    particles:
    - SOUL

# ---------- 释梦（右键发射灵魂沙弹） ----------
# 右键朝视线方向打出一道灵魂沙粒子弹（射程 15 格，**碰到方块就停下、不穿墙**）；
# 发射音效 = **只有一个**：音符盒放在**羊毛**上、**左键 6 次**后的那一声
#   （block.note_block.guitar，音高 0.7071 = note 6）；
# ★ 无冷却、无任何提示词（2026-10-08 第六批删除）。
# 没命中生物就什么都不发生。命中后：
#   从生物正上方 drop-from 格开始播放下坠动画，**砸到身上那一刻结算一次伤害**；
#   重复 damage-seconds 次（默认 **1** 次下坠 = 1 次伤害）。
# ★ 伤害**不带击退**（脚本结算前存 velocity、打完立刻还原）。
# ★ 没有"内爆/炸开"，也没有任何会持续残留的粒子云。
# ★ 2026-10-06 末次：每段伤害 25 → **40**、下坠 3 → **1** 次、
#   音效只剩音符盒那一声（铁砧/锻造台/心跳都撤了）。
# ★ 2026-10-08 第六批：**冷却与冷却提示整段删除** ——
#   右键不再有 CD，也不再提示「可以重新割开梦境」；
#   原来的 cooldown-millis / ready-message 两项配置一并删除（留着也不会被读取）。
release-dream:
  # 弹道最大飞行距离（格）
  range: 15.0
  # 每游戏刻前进多少格（越大越快；别超过 1，否则可能穿过一格厚的墙）
  step: 0.7
  # 命中判定半径（格）
  hit-radius: 0.8
  # 每次下坠从生物正上方几格开始
  drop-from: 6.0
  # 两次下坠之间的间隔（游戏刻）：20 = 1 秒（damage-seconds = 1 时用不到）
  hit-interval: 20
  # 每次结算的伤害（40 = 20 颗心；2026-10-06：10 → 25 → 40）
  damage-per-second: 40.0
  # 下坠 / 伤害次数（**1 = 只砸一次**；2026-10-06：3 → 1）
  damage-seconds: 1
  # 发射音效（**只有一个**）：音符盒放在**羊毛**上、左键调音 **6 次**后的那一声
  #   羊毛 ⇒ 吉他音色 block.note_block.guitar；note 6 ⇒ pitch = 2^((6-12)/12) ≈ 0.7071
  #   （想改音高就调 sound-pitch：note n 的 pitch = 2^((n-12)/12)，0.5 = note 0，2.0 = note 24）
  sounds:
    - "block.note_block.guitar"
  # 音高（0.7071 = 左键 6 次 / note 6）；音量默认 1.0
  sound-pitch: 0.7071
  sound-volume: 1.0
  # 发射时的「坚守者心跳声」—— **2026-10-06 起默认关闭**（count = 0）
  #   旧键 scream-sound / scream-count / scream-slime-ticks 仍然兼容（读不到新键才回退）
  heartbeat-sound: "entity.warden.heartbeat"
  # 心跳之间的间隔（粘液刻）：1 粘液刻 = 10 刻 = 0.5 秒
  heartbeat-slime-ticks: 2
  # 发射时响几声（0 = 不响；想加回来就改成 1 / 2）
  heartbeat-count: 0

# ---------- 奇思妙想帽（佩戴生成想象力 · 2026-10-08 新增） ----------
thinking-hat:
  # 是否启用：头上佩戴「奇思妙想帽」时，从**头顶**掉落「想象力」
  enabled: true
  # 掉落间隔（游戏刻，20 刻 = 1 秒，即「每秒 1 个」）
  #   修改后需要重新加载附属（/rsc reload 或重启服务器）
  interval: 20
  # 是否只在生存 / 冒险模式下掉落（创造模式挂机不刷）
  survival-only: true

# ---------- 灵感（佩戴记忆碎片生成） ----------
inspiration:
  # 是否启用：头上佩戴「记忆碎片」时在脚下生成「灵感」
  enabled: true
  # 生成间隔（游戏刻，20 刻 = 1 秒，即「每秒 1 个」）
  #   修改后需要重新加载附属（/rsc reload 或重启服务器）
  interval: 20
  # 是否只在生存 / 冒险模式下生成（创造模式挂机不刷）
  survival-only: true
