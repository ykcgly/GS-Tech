# ==========================================
# 构思技艺 (GS) —— 物品组（分类）
# 「万物初生，始于想象」
# ==========================================
# 八大分类（tier 越小越靠前，现已全部开放）：
#   1  信息       PAPER                  （按钮：创作者 / 更新日志）
#   2  基础构思   STRING + 附魔光效       （材料链，第 21 格收尾）
#   3  构思机器   SEA_LANTERN
#   4  构思武器   IRON_SWORD             （入梦 / 释梦 / 五骊矟 / 精神力）
#   5  构思防具   IRON_CHESTPLATE        （奇思妙想帽 / 梦想套 / 梦境套）
#   6  构思boss   WITHER_SKELETON_SKULL  （枯骸骑将 / 妄念 / 暗影虫卵 / 守夜人的提灯 / 幻翼）
#   7  构思玩具   BREEZE_ROD
#   8  构思       WRITTEN_BOOK           （按钮：作者想说的一些话 / 图鉴）
#
# ★ 2026-10-08 第六批：**「构想维度」（gs_components，原 tier 3）整类删除** ——
#     它最后只剩「真实梦境 / 思创本构」两件，本次移入「基础构思」
#     （排在本构之后，即第 17 / 18 格）⇒ 分类数由九变八，
#     原 tier 4~9 全部**各减 1** 补齐空位。
#   基础构思现在共 19 项：
#     1 想象力 2 记忆碎片 3 灵感 4 臆想 5 念想 6 构想 7 雏形 8 律象 9 定式
#     10 梦 11 模 12 梦境规则 13 梦境锭 14 滚木 15 梦境 16 本构
#     17 真实梦境 18 思创本构 19 妄想碎片
#     ★ 这 19 件里，**除「滚木」外全部取消左右键交互**（见 gs_listener.js 的 gsPlainStart）
#
# ★ 2026-10-08 第二批：**删除「终集记忆」分类**（原 tier 9），织梦机整机一并移除 ——
#     构思武器 = 入梦 / 释梦 / 五骊矟 / 精神力
#     构思防具 = 奇思妙想帽 / 梦想头盔 / 梦想盔甲 / 梦想护腿 / 梦想战靴
#                / 梦境头盔 / 梦境盔甲 / 梦境护腿 / 梦境战靴
#     构思boss = 枯骸骑将 / 妄念 / 幻翼（妄想碎片已移入「基础构思」）
#     基础构思 = … 梦境锭 / 滚木 / 梦境 / 本构 / 妄想碎片
#   ⇒ 「构思」分类由 tier 10 提到 **tier 9**（补上终集记忆留下的空位）。
#
# 【关键约束 · 来自 RSC 源码】
#   1) gs_main 必须 type: nested，否则所有子分类注册失败，
#      items.yml 会报「无法找到物品组 (item_group): gs_basic」。
#   2) 放按钮(button)的分类，其 type 必须也是 nested，
#      因为按钮要求 parent 是 AdvancedNestedItemGroup。
#      所以 gs_info 也写成 nested。
# ==========================================

# ---------- 主分类（书与笔） ----------
# ★★★ 2026-10-12 第七十一批**修正 2**：用户「把构思技艺（材质为书与笔）的lore全部删除」
#    ⇒ `lore:` 段**整个删掉**（原来那 5 行：万物初生 / 空行 / 作者 / 空行 / 单击打开）。
#
# ★★ 删掉之后「单击打开」**照样会出现**，而且是**本体自动加**的那种 ——
#    javap 反编译 RSCItemGroupJEG#getItem / RSCItemGroupLegacy#getItem 的字节码：
#        if (!item.hasItemMeta())            → return FlexItemGroup.getItem(player);
#        meta = item.getItemMeta();
#        if (meta == null)                   → return FlexItemGroup.getItem(player);
#        lore = meta.getLore();
#        if (lore == null || lore.isEmpty()) → return FlexItemGroup.getItem(player);
#        return item;                        ← 配了 lore 才走这条（用自己的 item）
#    ⇒ **没有 lore** 正好命中「自动加」那条，回落到 ItemGroup#getItem，
#      它用 `new CustomItemStack(item, lambda)` 把 lore 设成
#          Arrays.asList("", GRAY + GREEN + 语言文件 guide.tooltips.open-itemgroup)
#        = `["", §7§a单击打开]` —— 和原来手写的那两行**一模一样**。
#    ★ 顺带核实：那个 lambda 还会 `setDisplayName(YELLOW + 名字)`，
#      但本分类的 name 本来就是 `&6&l构思技艺`（自带颜色码在最前）⇒
#      实际变成 `§e§6§l构思技艺`，**看起来还是原来的金色加粗**，没有变化。
#    ★ 也确认了 `Slimefun/messages.yml` 里**没有** gs_main 的条目
#      （只有 guide.tooltips.open-itemgroup = 单击打开），
#      所以 getItemGroupName 返回 null ⇒ 走「沿用自己名字」那条分支。
#    ★ 第七十一批最初是**手写**那两行的（当时还配着别的 lore，必须手写）；
#      现在按用户要求把 lore 清空 ⇒ 改回本体自动机制，两行不再需要手写。
gs_main:
  type: nested
  item:
    name: "&6&l构思技艺"
    material: WRITABLE_BOOK
    glow: true

# ---------- 1. 信息（纸） ----------
