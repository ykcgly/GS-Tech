# ==========================================
# 构思技艺 (GS) —— 自定义「仅作显示」配方类型
# 「万物初生，始于想象」
# ==========================================
# 作用：把基础材料的「获取途径」显示在配方页的
#       「机器位置」（配方类型图标那一格），
#       而不是显示在 3×3 九宫格里。
#
# 关键点：recipe_types.yml 里定义的配方类型是 CustomRecipeType，
#         它不绑定任何机器 —— 只作展示，玩家无法真的合成。
#         物品那边只要写 recipe_type: <这里的 ID> 并且不写 recipe，
#         就能做到「机器位置显示提示 + 九宫格全空 + 无法合成」。
#
# 加载顺序（源码 ProjectAddonLoader）：
#   ItemGroupReader(同步) → RecipeTypeReader(同步) → MenuReader → ItemReader(异步)
#   所以本文件的 ID 一定能在 items.yml 里被引用到。
#
# ID 规则：仅支持大写字母、数字、下划线。
# ==========================================
# ★ 2026-10-08 大改：
#   · 原来 4 种「纯展示」获取途径（捕捉 / 死亡 / 挖掘 / 拾取）**全部删除** ——
#     想象力、记忆碎片、臆想、念想现在都改成「构思机里合成」或「戴帽掉落」。
#   · 新增 GS_RT_HAT：想象力 = 佩戴「奇思妙想帽」时每秒从头顶掉 1 个。
#   · GS_RT_RULE_CONCEPTOR：显示名 规则构想机 → **构思机**，图标改成**雕刻南瓜**。
# ★ 2026-10-08 第二批：
#   · **删除 GS_RT_WEAR**（灵感已不再靠「佩戴记忆碎片」获取）。
#   · 新增 **GS_RT_ANTHROPOMORPHIC**：灵感 = 拟人思维（材料生成器）自动产出。
#   · **删除 GS_RT_DREAM_WEAVER**（织梦机整机已移除）。
#   · 新增 **GS_RT_DREAM_SUMMONER**：梦境套 / 真实梦境 / 思创本构 / 释梦 / 精神力
#     = 唤梦机里升级产出。
# ★ 2026-10-08 第三批：
#   · **构象侦测器整机删除**（它用的是 recipe_type: "NULL"，本文件无需改动）。
#   · 新增「构想分析机」（材料生成器）：它的展示配方也用 GS_RT_RULE_CONCEPTOR，
#     所以这里同样无需新增条目。
# ==========================================

# ---------- 想象力：佩戴奇思妙想帽 ----------
GS_RT_HAT:
  material: GOLDEN_HELMET          # 金头盔 = 那顶帽子
  name: "&e佩戴"
  lore:
    - "&7灵光自头顶源源不断"
    - ""
    - "&8头上戴「奇思妙想帽」时"
    - "&8每秒从头顶掉落 1 个"
    - ""
    - "&8（怎么拿帽子？看下面那格）"

# ---------- 灵感：拟人思维（材料生成器 · 自动产出） ----------
GS_RT_ANTHROPOMORPHIC:
  material: SOUL_SOIL              # 灵魂土 = 拟人思维那台机器
  name: "&b拟人思维"
  lore:
    - "&7让构思拥有人的形状"
    - ""
    - "&8把材料无中生有："
    - "&8放下来就会自己产出「灵感」"
    - "&8不需要任何输入"

# ---------- 雏形及规则系列 / 各大机器：构思机（多方块机器） ----------
# 显示在配方页的「机器位置」，说明这台多方块机器怎么用。
# CustomRecipeType 不绑定任何机器 → 只作展示，无法在别处真的合成。
GS_RT_RULE_CONCEPTOR:
  material: CARVED_PUMPKIN         # 雕刻南瓜 = 需要右键的那一格
  name: "&6构思机"
  lore:
    - "&7以规则约束构想"
    - ""
    - "&8搭法（只要两个方块）："
    - "&8    上面 · 雕刻南瓜"
    - "&8    下面 · 发射器"
    - ""
    - "&8把材料按九宫格放进「发射器」，"
    - "&8右键上面那块「雕刻南瓜」即可合成"

# ---------- 梦境 / 本构 / 滚木 / 枯骸骑将 / 妄念：万象归序·心智构象熔炼炉 ----------
# 同样只是「仅作显示」的配方类型，显示在配方页的「机器位置」。
GS_RT_MIND_SMELTING:
  material: BEACON
  name: "&5万象归序·心智构象熔炼炉"
  lore:
    - "&7渗透规则，小子。"
    - ""
    - "&8把材料放进第 1 行输入槽，"
    - "&8第 3~6 行取出产物"
    - "&8第 2 行第 5 格是进度"

# ---------- 唤梦机：升级机器（左物品 + 右材料 → 产物） ----------
GS_RT_DREAM_SUMMONER:
  material: ANVIL
  name: "&6唤梦机"
  lore:
    - "&7造梦工厂"
    - ""
    - "&8左边放进要升级的物品，"
    - "&8右边放进指定数量的材料，"
    - "&8中间产出，第 22 格是进度"

# ---------- 第八十六批：**纯掉落物**的获取提示 ----------
# 下面 **8** 条都是「仅作显示」的配方类型 —— 显示在配方页**左边那一格**（槽 10）。
# 对应物品那边写 `recipe_type: <这里的 ID>` 且**不写 `recipe:`** ⇒
# 左边显示「从哪来」+ 九宫格全空 + 无法合成。
# ★ 用到的物品：妄想碎片 / 残樱 / 致万千无言者 / 月镰 / 海水过滤器 /
#   **暗影宝珠 / 血夜粒**（后两件是用户后补的：
#   「暗影宝珠，血夜粒的配方界面没写谁掉的」）/ **五骊矟**
#   （第八十七批：「五骊矟配方界面写上枯骸骑将掉落」）。

