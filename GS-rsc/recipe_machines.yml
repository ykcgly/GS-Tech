        2: {material_type: slimefun, material: GS_DREAM_INGOT, amount: 49}
      output:
        1: {material_type: slimefun, material: GS_RELEASE_DREAM, amount: 1}

    # ---------- 9. 蚀月·死神梦镰：月镰 + 60 血夜粒（514 秒）★ 第十五批新增 ----------
    #   ★★★ 第八十六批：右槽 **37 梦境锭 → 60 血夜粒**（用户「蚀月配方改成
    #      月镰+60血夜粒」）⇒ 左槽仍是**月镰**，**合成时间 514 秒不动**。
    #      血夜粒 = 守夜人的提灯**二阶段**掉落物（固定 6 个）。
    #   ⚠ 左槽 GS_MOON_SCYTHE 与前面任何一条都不重样 ⇒ 顺序不会造成误匹配。
    eclipse_scythe:
      seconds: 514
      input:
        1: {material_type: slimefun, material: GS_MOON_SCYTHE,       amount: 1}
        2: {material_type: slimefun, material: GS_BLOOD_NIGHT_GRAIN, amount: 60}
      output:
        1: {material_type: slimefun, material: GS_ECLIPSE_SCYTHE, amount: 1}

    # ---------- 10. 余念绝响：残樱 + 60 妄想碎片（★ 第十五批：514 → 1919 秒）----------
    #   ★★ 第六十二批：左槽由「入梦」改成 **残樱**（用户：「余念绝响的配方改成
    #      残樱+36妄想碎片在唤梦机合成，时间不变」）⇒ 右槽 36 妄想碎片不动，
    #      **合成时间 1919 秒不动**（用户明确说了"时间不变"）。
    #   ★ 物品同时改名为「余念绝响」（原「精神力」）—— 那只影响显示名，与配方无关。
    #   ★★★ 第八十五批：右槽 **36 → 60** 妄想碎片（用户「余念绝响配方改成
    #      60个妄想碎片+残樱」）⇒ 左槽仍是残樱，**时间仍是 1919 秒**。
    #      同时妄想碎片的来源也改了：妄念**只有第三阶段掉、固定 6 个**
    #      （见 scripts/gs_boss_three.js 的 BT_FRAG_DROP）。
    #   ⚠ 唤梦机按顺序找**第一个**匹配的配方；本条左槽 GS_CHERRY 与前面任何一条都不重样
    #     ⇒ 顺序不会造成误匹配。
    psychic_power:
      seconds: 1919
      input:
        1: {material_type: slimefun, material: GS_CHERRY,             amount: 1}
        2: {material_type: slimefun, material: GS_WANGXIANG_FRAGMENT, amount: 60}
      output:
        1: {material_type: slimefun, material: GS_PSYCHIC_POWER,      amount: 1}

    # ---------- 11. 此刻万籁俱寂：致万千无言者 + 60 暗影宝珠（810 秒）★ 第三十八批新增 ----------
    #   ★ 位置按用户要求：**排在精神力后面**（配方顺序第 11 条）。
    #     ⚠ 唤梦机按顺序找**第一个**匹配的配方；本条左槽是 GS_VOICELESS，
    #       与前面任何一条都不重样 ⇒ 顺序不会造成误匹配。
    #   ★ 合成时间 **810 秒**（用户指定）。
    #   ★ 物品在粘液书里的格位是**构思武器第 7 格**（阎魔刀·改前面）——
    #     那是 display_tier 的事，与这里的配方顺序**互不影响**。
    #   ★★ 2026-10-10 第四十批：右槽由「45 梦境锭」改成 **60 妄想碎片**
    #      （`GS_WANGXIANG_FRAGMENT`，妄念 boss 掉落物）—— **时间不变，仍是 810 秒**。
    #   ★★★ 第八十五批：右槽再改成 **60 暗影宝珠**（`GS_SHADOW_ORB`，
    #      暗影虫卵第三阶段掉落物）—— 用户：「此刻万籁俱寂配方改成
    #      60个暗影宝珠+致万千无言者」。左槽与 **810 秒都不动**。
    utter_silence:
      seconds: 810
      input:
        1: {material_type: slimefun, material: GS_VOICELESS,   amount: 1}
        2: {material_type: slimefun, material: GS_SHADOW_ORB,  amount: 60}
      output:
        1: {material_type: slimefun, material: GS_SILENCE,     amount: 1}

# ==========================================================================
# 海水过滤器 · GS_SEA_FILTER（可放置机器 · 青色玻璃 · 不用电 · 第五十八批新增）
# ==========================================================================
#   ★ 用户需求：
#       「制作一个新物品，机器（放在构思玩具，不用电），叫海水过滤器，
#         材质为青色玻璃，lore：分手吧，你连海水过滤器都没有
#         gui54格，第一二三列放上占位，第二行第二格是输入槽，需要放入水桶，
#         第五行第二格是进度，进度为15秒材质为纸
#         消耗1水桶，15秒后必定产出1个桶和粘液科技基础9粉
#         （金银铜铁锌镁锡铅铝）各12个，30%7个铁锭，18%3个金锭，15%5个红石，
#         8%3个绿宝石，7%2个钻石，12%16个青金石，10%64个线
#         剩下的第四列~第九列格子全是输出槽
#         配方为钓鱼获得，监听玩家钓鱼，钓率7%，1个」
#
#   ★ 分类：**构思玩具 gs_toy 第 8 格**（用户明确要求"放在构思玩具"）。
#     ★★★ 第八十八批：用户「删除构念，构思玩具全部往前移一格」
#       ⇒ 构念（原第 1 格）整件删除、玩具整体前移 ⇒ 本机器 **9 → 8**。
#   ★ 不用电：capacity 必须 > 0（Slimefun 的 isChargeable 判定），
#     但 energyPerCraft = 0 ⇒ 完全不耗电。
#
#   GUI = 54 格（6 行 × 9 列，见 menus.yml 的 GS_SEA_FILTER）：
#     ┌───┬───┬───┬───┬───┬───┬───┬───┬───┐
#     │占位│占位│占位│ 出 │ 出 │ 出 │ 出 │ 出 │ 出 │   第 1 行  槽 0~8
#     ├───┼───┼───┼───┼───┼───┼───┼───┼───┤
#     │占位│输入│占位│ 出 │ 出 │ 出 │ 出 │ 出 │ 出 │   第 2 行  槽 9~17   ↑10
#     ├───┼───┼───┼───┼───┼───┼───┼───┼───┤
#     │占位│占位│占位│ 出 │ 出 │ 出 │ 出 │ 出 │ 出 │   第 3 行  槽 18~26
#     ├───┼───┼───┼───┼───┼───┼───┼───┼───┤
#     │占位│占位│占位│ 出 │ 出 │ 出 │ 出 │ 出 │ 出 │   第 4 行  槽 27~35
#     ├───┼───┼───┼───┼───┼───┼───┼───┼───┤
#     │占位│进度│占位│ 出 │ 出 │ 出 │ 出 │ 出 │ 出 │   第 5 行  槽 36~44   ↑37
#     ├───┼───┼───┼───┼───┼───┼───┼───┼───┤
#     │占位│占位│占位│ 出 │ 出 │ 出 │ 出 │ 出 │ 出 │   第 6 行  槽 45~53
#     └───┴───┴───┴───┴───┴───┴───┴───┴───┘
#       · 第 1~3 列 = **占位**（青色玻璃板；槽 10 / 37 除外）
#       · 槽 10（第 2 行第 2 格）= **输入槽**（放水桶）
#       · 槽 37（第 5 行第 2 格）= **进度**（空闲纸 → 运行时青色玻璃）
#       · 第 4~9 列 **共 36 格全是输出槽**
#
#   ★★ 耗时 **15 秒**：RSC 配方刻 = (seconds × 2) / speed 个**粘液刻**，
#      而 1 粘液刻 = 0.5 秒（Slimefun 默认 URID.custom-ticker-delay: 10）
#      ⇒ seconds: 15 → 30 粘液刻 → **15 秒**。
#
#   ★★ 产出的写法（`chance` 是本附属里第一次用，已反编译核对 RSC 源码）：
#      `RecipeMachineTickerCreator.readRecipes` 对 output 下**每一个子节**
#      单独 `readItem` + `getInt("chance", 100)`（再 clamp 到 1~100），
#      存成与产物一一对应的 `IntList chances`；
#      `CustomMachineRecipe.getMatchChanceResult(chooseOne)` 对**每个产物各掷一次**
#      `matchChance(chance)`（chance ≥ 100 必中、< 1 必不中、否则 nextInt(100) < chance）。
#      `chooseOne` 默认 false ⇒ **每条产物独立结算**，正是用户要的
#      "必定 + 若干条各自 x% 概率"。
#      ⇒ 所以这里写 17 条产物：10 条 chance 100 + 7 条各自概率。
#   ⚠ amount 上限 100（CommonUtils#readItem）—— 这里最大 64，安全。
#   ⚠ 36 个输出槽 ≥ 17 条产物，一次全中也不会溢出。
# ==========================================================================
GS_SEA_FILTER:
  item_group: gs_toy
  display_tier: 8              # ★ 第八十八批：9 → 8（构念删除后整体前移）
  item:
    name: "&3海水过滤器"
    material: CYAN_STAINED_GLASS          # 青色玻璃
    lore:
      - "&7分手吧，你连海水过滤器都没有"
  # ★★ 本机器**没有合成配方** —— 只能靠**钓鱼**获得（7%，见 gs_listener.js
  #    的 gsSfStart）。
  # ★★★ 第八十六批：`recipe_type` 由 `"NULL"` 改成 **GS_RT_SEA_FILTER** ——
  #     用户「给海水过滤器的配方界面**左边**写上**钓鱼概率获得**」。
  #     该配方类型定义在 recipe_types.yml，显示在配方页**左边那一格**（槽 10），
  #     本机器**不写 `recipe:`** ⇒ 左边显示提示 + 九宫格全空 + 无法合成。
  recipe_type: GS_RT_SEA_FILTER   # ★ 第八十六批：配方页左边写「钓鱼概率获得」
  capacity: 1000           # ★ 必须 > 0（Slimefun 的 isChargeable 判定）：0 会让 takeCharge 恒失败、机器点不出产物；不耗电靠下面的消耗值填 0
  add_power_buffer_lore: false   # ★ 不显示「可储存 N J」那行自动 lore（本来就不耗电）
  energyPerCraft: 0
  speed: 1
  input: [10]              # 输入槽：第 2 行第 2 格（放水桶）
  output: [3, 4, 5, 6, 7, 8,              # 第 1 行 第 4~9 格
           12, 13, 14, 15, 16, 17,        # 第 2 行 第 4~9 格
           21, 22, 23, 24, 25, 26,        # 第 3 行 第 4~9 格
           30, 31, 32, 33, 34, 35,        # 第 4 行 第 4~9 格
           39, 40, 41, 42, 43, 44,        # 第 5 行 第 4~9 格
           48, 49, 50, 51, 52, 53]        # 第 6 行 第 4~9 格（共 36 格）
  recipes:
    # ---------- 淡化海水：1 水桶 → 1 桶 + 9 种基础粉各 12 个（15 秒）----------
    #   100% 产出（10 条）：桶 ×1 + 金银铜铁锌镁锡铅铝 9 种粉 ×12
    #   概率产出（7 条，**各自独立结算**）：
    #       30% 铁锭 ×7 ｜ 18% 金锭 ×3 ｜ 15% 红石 ×5 ｜ 8% 绿宝石 ×3
    #       7% 钻石 ×2 ｜ 12% 青金石 ×16 ｜ 10% 线 ×64
    desalinate:
      seconds: 15                 # 15 × 2 = 30 粘液刻 = 15 秒
      input:
        1: {material_type: mc, material: WATER_BUCKET, amount: 1}

      output:
        # ---------- 100%：桶 ----------
        1:  {material_type: mc, material: BUCKET, amount: 1, chance: 100}

        # ---------- 100%：粘液科技基础 9 粉，各 12 个 ----------
        #   顺序按用户给的「金银铜铁锌镁锡铅铝」
        2:  {material_type: slimefun, material: GOLD_DUST,       amount: 12, chance: 100}   # 金
        3:  {material_type: slimefun, material: SILVER_DUST,     amount: 12, chance: 100}   # 银
        4:  {material_type: slimefun, material: COPPER_DUST,     amount: 12, chance: 100}   # 铜
        5:  {material_type: slimefun, material: IRON_DUST,       amount: 12, chance: 100}   # 铁
        6:  {material_type: slimefun, material: ZINC_DUST,       amount: 12, chance: 100}   # 锌
        7:  {material_type: slimefun, material: MAGNESIUM_DUST,  amount: 12, chance: 100}   # 镁
        8:  {material_type: slimefun, material: TIN_DUST,        amount: 12, chance: 100}   # 锡
        9:  {material_type: slimefun, material: LEAD_DUST,       amount: 12, chance: 100}   # 铅
        10: {material_type: slimefun, material: ALUMINUM_DUST,   amount: 12, chance: 100}   # 铝

        # ---------- 概率产出（各自独立掷骰）----------
        11: {material_type: mc, material: IRON_INGOT,  amount: 7,  chance: 30}   # 30% 铁锭 ×7
        12: {material_type: mc, material: GOLD_INGOT,  amount: 3,  chance: 18}   # 18% 金锭 ×3
        13: {material_type: mc, material: REDSTONE,    amount: 5,  chance: 15}   # 15% 红石 ×5
        14: {material_type: mc, material: EMERALD,     amount: 3,  chance: 8}    #  8% 绿宝石 ×3
        15: {material_type: mc, material: DIAMOND,     amount: 2,  chance: 7}    #  7% 钻石 ×2
        16: {material_type: mc, material: LAPIS_LAZULI, amount: 16, chance: 12}  # 12% 青金石 ×16
        17: {material_type: mc, material: STRING,      amount: 64, chance: 10}   # 10% 线 ×64
