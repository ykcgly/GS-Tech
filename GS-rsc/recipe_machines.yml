    #   ★★★ 第八十七批：右槽 **20 → 49**（用户「构思武器的释梦梦境锭需求
    #      改成49个」）⇒ 左槽仍是**入梦**，**合成时间 114 秒不动**。
    release_dream:
      seconds: 114
      input:
